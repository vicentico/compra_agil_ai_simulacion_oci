# ==========================================================================
# Prometheus — scrapea el exporter Prometheus del OTel Collector (pull).
# Los servicios .NET NO se scrapean directamente: todos exportan vía OTLP al
# Collector (ADR-011), que es el único origen de métricas.
# ==========================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    # Sin esto, Prometheus renombra la label "job" que ya trae cada métrica
    # (derivada de service.name por el Collector) a "exported_job", porque
    # colisiona con la label "job" que el propio scrape_config asignaría.
    # Con honor_labels:true se conserva el "job" real (nombre del servicio
    # .NET) — necesario para el dashboard y para la correlación con Loki
    # (mismo label "job" en ambos datasources, ver datasources.yaml).
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
