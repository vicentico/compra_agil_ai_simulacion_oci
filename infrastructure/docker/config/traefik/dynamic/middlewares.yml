# Configuración dinámica de Traefik: middlewares transversales.
# TLS real queda fuera de alcance del POC local (http-only, ver FASE 19 para
# producción/OCI). Rate limit agregado en FASE 3 (docs/12-security/01,
# T5 del threat model) — por IP de origen; por-usuario-autenticado requeriría
# forwardAuth extrayendo el claim `sub` a un header, diferido explícitamente
# (no hay todavía ningún endpoint cuyo abuso por usuario individual, en vez
# de por IP, sea un riesgo medido — se revisita si aparece esa necesidad).
http:
  middlewares:
    ppip-security-headers:
      headers:
        stsSeconds: 0            # HTTPS aún no habilitado en FASE 1 (POC http-only local)
        contentTypeNosniff: true
        browserXssFilter: true
        customFrameOptionsValue: "SAMEORIGIN"
    ppip-rate-limit:
      rateLimit:
        average: 20   # requests/segundo sostenidas, por IP de origen
        burst: 40
