# ==========================================================================
# Tempo — backend de traces elegido en FASE 2 sobre Jaeger (ADR-011 Amendment,
# ver docs/05-architecture-decisions/ADR-011-observability.md). Modo
# single-binary con almacenamiento local en disco, suficiente para el POC.
# ==========================================================================
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
