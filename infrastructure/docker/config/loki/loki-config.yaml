# ==========================================================================
# Loki — modo single-process con almacenamiento local en disco (TSDB).
# Suficiente para el POC local (ADR-011 rechazó ELK por ser más pesado que
# Loki); en OCI el mapeo es Logging Analytics (docs/04-architecture/11).
# ==========================================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
